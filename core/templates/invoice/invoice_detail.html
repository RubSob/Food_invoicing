{% extends 'base.html' %}
{% block content %}

<h2>Invoice {{ invoice.id }}</h2>

<p>{{ invoice.customer.name }}</p>

<ul>
{% for item in invoice.items.all %}
<li>{{ item.product.name }} x {{ item.quantity }}</li>
{% endfor %}
</ul>

<p>Total: {{ invoice.total_price }}</p>

<a href="{% url 'add_item' invoice.id %}" class="btn btn-primary">Add Item</a>
<a href="{% url 'mark_paid' invoice.id %}" class="btn btn-success">Mark Paid</a>

{% endblock %}
