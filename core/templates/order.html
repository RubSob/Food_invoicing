{% extends 'base.html' %}
{% block content %}

<h4>Create Order</h4>

<form method="post" class="card p-3">
{% csrf_token %}

{% for item in items %}
    <div class="row mb-2 align-items-center">
        <div class="col-6">
            <b>{{item.name}}</b>
        </div>

        <div class="col-3">
            €{{item.price}}
        </div>

        <div class="col-3">
            <input type="number" class="form-control" name="item_{{item.id}}" value="0" min="0">
        </div>
    </div>
{% endfor %}

<button class="btn btn-success mt-3">Place Order</button>

</form>

{% endblock %}
