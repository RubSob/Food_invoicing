<!DOCTYPE html>
<html>
<head>
    <title>SmartFood</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">🍽 SmartFood System</h2>

        <div>
            <span class="me-3">
                Logged in as: <b>{{request.user.username}}</b> ({{request.user.role}})
            </span>
            <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>

    <!-- NAV -->
    <div class="mb-4">
        <a href="/" class="btn btn-outline-primary">Dashboard</a>
        <a href="/order/" class="btn btn-outline-success">Create Order</a>
    </div>

    {% block content %}{% endblock %}

</div>

</body>
</html>
