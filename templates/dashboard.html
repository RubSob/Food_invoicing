{% extends 'base.html' %}
{% block content %}

<h4 class="mb-3">Orders</h4>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
    {% for o in orders %}
        <tr>
            <td>{{o.id}}</td>

            <td>
                {% if o.status == "Pending" %}
                    <span class="badge bg-warning">Pending</span>
                {% elif o.status == "Delivered" %}
                    <span class="badge bg-success">Delivered</span>
                {% else %}
                    <span class="badge bg-secondary">{{o.status}}</span>
                {% endif %}
            </td>

            <td>{{o.created_at}}</td>

            <td>
                <a href="/invoice/{{o.id}}/" class="btn btn-sm btn-primary">Invoice</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>

{% endblock %}
